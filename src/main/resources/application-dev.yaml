app:
  security:
    default-role: ${APP_DEFAULT_ROLE:PACIENTE}
    public-paths: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/otp/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**
    password-reset:
      expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
      frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:4200/auth/restablecer-contrasena}
    mfa:
      expiration-minutes: ${MFA_OTP_EXPIRATION_MINUTES:5}
      max-attempts: ${MFA_OTP_MAX_ATTEMPTS:5}
      resend-cooldown-seconds: ${MFA_OTP_RESEND_COOLDOWN_SECONDS:60}
  mail:
    mode: ${MAIL_MODE:log}
  timezone: ${APP_TIMEZONE:America/Lima}

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: ${JPA_FORMAT_SQL:true}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jackson:
    time-zone: ${app.timezone}
    date-format: yyyy-MM-dd'T'HH:mm:ss
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: "${GITHUB_CLIENT_ID}"
            client-secret: "${GITHUB_CLIENT_SECRET}"
            scope:
              - user:email
              - read:user
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope:
              - email
              - profile

logging:
  file:
    name: logs/auth-service.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.ahuanay.auth: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: WARN
    org.hibernate.engine.jdbc.batch: WARN

jwt:
  secret: "${JWT_SECRET}"
  expiration: ${JWT_EXPIRATION:900000} # 15 min por defecto
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:3600000} # 1 hora por defecto