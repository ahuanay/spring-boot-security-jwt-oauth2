app:
  security:
    default-role: PACIENTE
    public-paths: /api/v1/auth/login,/api/v1/auth/register,/api/v1/auth/refresh,/api/v1/auth/forgot-password,/api/v1/auth/reset-password,/api/v1/auth/otp/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**
    password-reset:
      expiration-minutes: 30
      frontend-url: http://localhost:4200/auth/restablecer-contrasena
    mfa:
      expiration-minutes: 5
      max-attempts: 5
      resend-cooldown-seconds: 60
  mail:
    mode: log
  timezone: America/Lima

server:
  port: 0

spring:
  application:
    name: auth-service-test
  mail:
    host: localhost
    port: 1025
    username:
    password:
  datasource:
    url: jdbc:h2:mem:auth_db_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  jackson:
    time-zone: ${app.timezone}
    date-format: yyyy-MM-dd'T'HH:mm:ss
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: dummy-github-client-id-for-testing
            client-secret: dummy-github-client-secret-for-testing
            scope:
              - user:email
              - read:user
          google:
            client-id: dummy-google-client-id-for-testing
            client-secret: dummy-google-client-secret-for-testing
            scope:
              - email
              - profile

logging:
  level:
    root: INFO
    com.ahuanay.auth: DEBUG
    org.springframework.test: INFO

jwt:
  secret: "estaEsUnaClaveSecretaDePruebasFicticiaYMuyLargaParaQueCumplaConLosRequisitosDeHMACSHA256"
  expiration: 900000
  refresh-expiration: 3600000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false