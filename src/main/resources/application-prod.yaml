app:
  timezone: ${APP_TIMEZONE:America/Lima}

server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: ${app.timezone}
    date-format: yyyy-MM-dd'T'HH:mm:ss

logging:
  file:
    name: /var/log/ahuanay/auth-service.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 90
      total-size-cap: 5GB
  level:
    root: WARN
    com.ahuanay.auth: INFO
    org.springframework.web: WARN
    org.hibernate: ERROR
    com.zaxxer.hikari: WARN
    org.hibernate.engine.jdbc.batch: WARN

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}        # 24 horas por defecto en producción
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 días por defecto en producción

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false