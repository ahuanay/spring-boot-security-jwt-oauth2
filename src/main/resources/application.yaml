app:
  timezone: ${APP_TIMEZONE:America/Lima}

server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  profiles:
    active: ${PROFILE:dev}
  jackson:
    time-zone: ${app.timezone}
    date-format: yyyy-MM-dd'T'HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs